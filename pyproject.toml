[project]
name = "credit-risk-mcp-toolkit"
version = "0.1.0"
description = "Servidor MCP de herramientas de riesgo de crédito"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]<2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]